# CI/CD for MYASSISTANT_BACKEND
#
# Pipeline: test → build+push image to GHCR → deploy to Kubernetes (main only)
#
# Images are pushed to GitHub Container Registry (ghcr.io) using the built-in
# GITHUB_TOKEN — no extra registry secrets needed.
#
# The deploy job needs ONE repo secret:
#   KUBE_CONFIG — base64 of your kubeconfig:  base64 -w0 ~/.kube/config
# If KUBE_CONFIG is not set, the deploy job is skipped (CI still runs).

name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ghcr.io/<owner>/<repo>, lowercased below

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Smoke tests boot the real server with a throwaway DB — no API keys.
      - run: npm test
        env:
          JWT_SECRET: ci-only-secret-not-used-in-prod-0123456789abcdef

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Push images only from main; PRs just build to verify the Dockerfile.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name (GHCR requires it)
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check KUBE_CONFIG secret
        id: check
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "have_kubeconfig=true" >> "$GITHUB_OUTPUT"
          else
            echo "No KUBE_CONFIG secret — skipping deploy."
          fi

      - name: Set up kubeconfig
        if: steps.check.outputs.have_kubeconfig == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy new image
        if: steps.check.outputs.have_kubeconfig == 'true'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          kubectl -n myassistant set image deployment/myassistant-backend \
            backend="$IMAGE"

      # AUTOMATED ROLLBACK: if the rollout doesn't go healthy within the
      # timeout (readiness probe failing, image crash-looping, etc.),
      # undo to the previous ReplicaSet and fail the job loudly.
      - name: Wait for rollout — rollback on failure
        if: steps.check.outputs.have_kubeconfig == 'true'
        run: |
          if ! kubectl -n myassistant rollout status deployment/myassistant-backend --timeout=180s; then
            echo "::error::Rollout failed — rolling back to previous revision"
            kubectl -n myassistant rollout undo deployment/myassistant-backend
            kubectl -n myassistant rollout status deployment/myassistant-backend --timeout=120s
            exit 1
          fi
