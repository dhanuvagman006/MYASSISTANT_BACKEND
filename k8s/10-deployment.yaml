# Deployment for MYASSISTANT_BACKEND
#
# DB is Postgres (see 05-postgres.yaml) → many pods can write safely, so
# RollingUpdate gives zero-downtime deploys and the HPA (40-hpa.yaml) can
# scale replicas. The PVC now holds ONLY user document files (DATA_DIR/files);
# note it is ReadWriteOnce, so all replicas schedule onto the same node —
# fine on a single-node k3s. For multi-node scaling later, move files to
# S3-compatible storage or an RWX StorageClass.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myassistant-backend
  namespace: myassistant
  labels:
    app: myassistant-backend
spec:
  replicas: 1  # HPA takes over replica count once 40-hpa.yaml is applied
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: myassistant-backend
  template:
    metadata:
      labels:
        app: myassistant-backend
    spec:
      securityContext:
        fsGroup: 1000 # node user in the image — makes the PVC writable
      containers:
        - name: backend
          # CI overwrites this tag on every deploy (kubectl set image).
          image: ghcr.io/dhanuvagman006/myassistant_backend:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: myassistant-config
            - secretRef:
                name: myassistant-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Server exposes GET /health -> {ok:true}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # multer/doc uploads write temp files
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: myassistant-data
---
apiVersion: v1
kind: Service
metadata:
  name: myassistant-backend
  namespace: myassistant
  labels:
    app: myassistant-backend
spec:
  type: ClusterIP
  selector:
    app: myassistant-backend
  ports:
    - name: http
      port: 80
      targetPort: http
