# Values for grafana/loki-stack (Loki + Promtail, single-binary mode).
# Promtail runs as a DaemonSet and ships stdout/stderr of every pod —
# the backend's console logs land in Loki automatically.
loki:
  persistence:
    enabled: true
    size: 10Gi
  config:
    limits_config:
      retention_period: 336h # 14 days
    compactor:
      retention_enabled: true

promtail:
  enabled: true

grafana:
  enabled: false # already installed via kube-prometheus-stack
  sidecar:
    datasources:
      enabled: true # auto-register Loki datasource in that Grafana
