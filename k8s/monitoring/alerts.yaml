# Alert rules for MYASSISTANT_BACKEND.
# Built entirely from kube-state-metrics + cAdvisor metrics, so they work
# with zero application changes. Routed by Alertmanager (see helm values).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: myassistant-backend-alerts
  namespace: myassistant
  labels:
    release: kps # must match the kube-prometheus-stack release name
spec:
  groups:
    - name: myassistant.availability
      rules:
        - alert: BackendDown
          expr: |
            kube_deployment_status_replicas_available{namespace="myassistant", deployment="myassistant-backend"} < 1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "MYASSISTANT backend has no available replicas"
            description: "No ready pods for 2+ minutes — API is down."

        - alert: BackendCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="myassistant", container="backend"}[15m]) > 3
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Backend restarting repeatedly"
            description: "{{ $value }} restarts in 15m — check logs: {namespace=\"myassistant\"} in Loki."

        - alert: BackendNotReady
          expr: |
            kube_pod_status_ready{namespace="myassistant", condition="false"}
            * on(pod) group_left kube_pod_labels{namespace="myassistant", label_app="myassistant-backend"} == 1
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Backend pod failing readiness for 5m"

    - name: myassistant.resources
      rules:
        - alert: BackendHighMemory
          expr: |
            container_memory_working_set_bytes{namespace="myassistant", container="backend"}
              / on(pod, container)
            kube_pod_container_resource_limits{namespace="myassistant", container="backend", resource="memory"} > 0.9
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Backend memory >90% of limit for 10m (OOM-kill risk)"

        - alert: BackendHighCPU
          expr: |
            rate(container_cpu_usage_seconds_total{namespace="myassistant", container="backend"}[5m])
              / on(pod, container)
            kube_pod_container_resource_limits{namespace="myassistant", container="backend", resource="cpu"} > 0.9
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Backend CPU throttling territory (>90% of limit for 15m)"

    - name: myassistant.storage
      rules:
        - alert: DataVolumeFilling
          expr: |
            kubelet_volume_stats_available_bytes{namespace="myassistant", persistentvolumeclaim="myassistant-data"}
              / kubelet_volume_stats_capacity_bytes{namespace="myassistant", persistentvolumeclaim="myassistant-data"} < 0.15
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "SQLite data PVC <15% free — expand it before writes fail"

        - alert: BackupJobFailed
          expr: |
            kube_job_status_failed{namespace="myassistant", job_name=~"myassistant-db-backup.*"} > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Nightly DB backup job failed — check job logs"
