# Values for prometheus-community/kube-prometheus-stack
# Sized for a small single-app cluster.
prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    # Pick up PrometheusRule/ServiceMonitor objects from ALL namespaces,
    # not just ones created by this Helm release (lets alerts.yaml work).
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

grafana:
  persistence:
    enabled: true
    size: 2Gi
  # Change after first login, or set via a secret.
  adminPassword: change-me-on-first-login

alertmanager:
  config:
    route:
      receiver: "default"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      # Replace with your real notification channel. Examples:
      #
      # Slack:
      #   - name: "default"
      #     slack_configs:
      #       - api_url: "https://hooks.slack.com/services/T000/B000/XXXX"
      #         channel: "#alerts"
      #         send_resolved: true
      #
      # Telegram:
      #   - name: "default"
      #     telegram_configs:
      #       - bot_token: "123:ABC"
      #         chat_id: 123456789
      #         send_resolved: true
      - name: "default"
