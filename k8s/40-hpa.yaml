# Horizontal Pod Autoscaler
#
# ✅ SAFE TO APPLY — the app now uses Postgres (05-postgres.yaml), which
# supports many concurrent writer pods. The Deployment already uses
# RollingUpdate.
#
# Prerequisite: Metrics Server (most managed clusters ship it; otherwise):
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
# Verify with: kubectl top pods -n myassistant

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myassistant-backend
  namespace: myassistant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myassistant-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # don't flap on brief traffic dips
